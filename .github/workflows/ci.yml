name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: build-only-secret-build-only-secret-123456
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:1/brasil_afora
      GOOGLE_CLIENT_ID: build-only-client
      GOOGLE_CLIENT_SECRET: build-only-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_STRUCTURED_OPPORTUNITIES: "true"
      RESEND_API_KEY: re_build_only
      RESEND_FROM_EMAIL: Brasil Afora <noreply@example.org>
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Lint and format contract
        run: bun run check
      - name: Type check
        run: bun x tsc --noEmit
      - name: Contract, migration, repository, workflow, and frontend tests
        run: bun run test --coverage
      - name: Production dependency audit
        run: bun audit --production
      - name: Production build
        run: bun run build
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: warn

